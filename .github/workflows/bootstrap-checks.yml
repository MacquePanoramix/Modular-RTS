name: Bootstrap checks (manual)

# No recurring schedule or PR-triggered agents. Available after merging this draft.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .automation/requirements.txt
      - run: python -m unittest discover -s .automation/tests -v
      - run: python .automation/controller/bootstrap.py doctor
