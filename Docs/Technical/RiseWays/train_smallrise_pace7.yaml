# pace7 (October 29; Luis: "Penalise holds"): as pace6, on Builds/RiseTrain23, where a pose not through while the body
# has been slow in it 3 s gives the try up (OwnRiser.StuckAfter): stuck with a foot raised up to 17.8 s, waiting out the
# pose's 20, a failed try cost pace6's pacer up to 1.8 for holds it could do nothing about. Begun from pace6's saves (the
# joints at 99,986, the pacer at 19,998). Resume with train_smallrise_pace7_resume.yaml.
#   --env-args -riseTrain -trainFull 1 -trainPace 1 -trainHoldsAsHeld 1 -trainFalls 1 -trainFreshFalls 1 -trainRetries 0.7 -trainRetriesAtMost 8 -trainNearer 1 -trainWays <ways file>
behaviors:
  SmallRiseFull:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace6/SmallRiseFull/SmallRiseFull-99986.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 200
  SmallRisePace:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace6/SmallRisePace/SmallRisePace-19998.pt
    hyperparameters:
      batch_size: 512
      buffer_size: 2048
      learning_rate: 1.0e-3
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 20000
    keep_checkpoints: 200
