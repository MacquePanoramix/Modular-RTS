# The third path (Luis, October 22, 2026): what the trainer is told for teaching SmallRise (RiseAgent), the moment from
# hands and feet to the squat. Run from D:/Dev (the trainer's own environment, D:/Dev/mlagents-env):
#   mlagents-env/Scripts/mlagents-learn WG/Docs/Technical/RiseWays/train_smallrise.yaml --run-id=<name> --results-dir=mlagents-results
# then the Unity side, the bench's way (RiseTraining, -trainWays <ways file>). See README.md here.
behaviors:
  SmallRise:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 5000
    checkpoint_interval: 50000
    keep_checkpoints: 10
