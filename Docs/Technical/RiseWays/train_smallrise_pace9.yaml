# pace9 (October 29, morning): as pace8, on Builds/RiseTrain24, taught on the game's own tries: in the game nearly every
# try begins where the last one left it, six and more deep, and from the sixth try in a row 7 to 12% reach the hand-over
# (33% of the first two); pace8 retried 70% of failed tries, at most 8 in a row. Here 90%, at most 12. Begun from pace8's
# last saves (the joints at 449,981, the pacer at 99,990). Resume with train_smallrise_pace9_resume.yaml.
#   --env-args -riseTrain -trainFull 1 -trainPace 1 -trainHoldsAsHeld 1 -trainFalls 1 -trainFreshFalls 1 -trainRetries 0.9 -trainRetriesAtMost 12 -trainNearer 1 -trainWays <ways file>
behaviors:
  SmallRiseFull:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace8/SmallRiseFull/SmallRiseFull-449981.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 200
  SmallRisePace:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace8/SmallRisePace/SmallRisePace-99990.pt
    hyperparameters:
      batch_size: 512
      buffer_size: 2048
      learning_rate: 1.0e-3
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 20000
    keep_checkpoints: 200
