# The learner paces its way (Luis, October 27: "Yes I think that approach sounds good"), as two: SmallRiseFull sets every
# joint at the hard moment, begun from full3 at 2,249,994 and taught on, and SmallRisePace, an agent of its own, says in
# every pose of the way how long it is kept (OwnRiser.Pace, a quarter to twice the searched time), each second of getting
# up costing it 0.02; both are given whether it stood. Taught on falls as in the game made anew for each try and on tries
# begun where the last left it. (One network for both, train_smallrise_paced.yaml, had to learn its joints' outputs in
# every pose, where they do nothing, and from nothing.) Run with
#   --env-args -riseTrain -trainFull 1 -trainPace 1 -trainFalls 1 -trainFreshFalls 1 -trainRetries 0.7 -trainRetriesAtMost 8 -trainNearer 1 -trainWays <ways file>
behaviors:
  SmallRiseFull:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/full3/SmallRiseFull/SmallRiseFull-2249994.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 250000
    keep_checkpoints: 40
  SmallRisePace:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 250000
    keep_checkpoints: 40
