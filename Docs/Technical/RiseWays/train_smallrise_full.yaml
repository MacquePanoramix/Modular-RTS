# Option 1 (Luis, October 26, 2026: "option 1"): what the trainer is told for teaching SmallRiseFull (RiseAgent with
# Full), which sets every joint's target itself at the hard moment (the second foot's step, the pike and the roll-up), on
# falls as in the game. Run from D:/Dev (the trainer's own environment, D:/Dev/mlagents-env):
#   mlagents-env/Scripts/mlagents-learn WG/Docs/Technical/RiseWays/train_smallrise_full.yaml --run-id=<name>
#     --results-dir=mlagents-results --env=WG/Builds/<build>/WonderGather.exe --num-envs=12 --no-graphics
#     --time-scale=1 --capture-frame-rate=50 --env-args -riseTrain -trainFull 1 -trainFalls 1 -trainWays <ways file>
# The help it is given only while it learns ("help": its joints stronger, its weight drawn; RiseSchool) goes from all of it
# to none by lessons, each passed once the mean reward is high enough (a try that stands is worth about 1.5 with
# what it is told on the way, one that does not about 0.1). The last lesson, none, lasts to the end.
# (Its help, RiseSchool: its joints 0.3 x help stronger, its weight drawn towards over its boots by up to 0.15 x help of
# its weight. Its ways: ways_roll_small_flat.txt.)
behaviors:
  SmallRiseFull:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 250000
    keep_checkpoints: 40
environment_parameters:
  # (Measured without learning, October 26: the help as small as it is here doubles what stands at most, 4 to 9 of 100;
  # a stand is worth about 1.5 with what it is told on the way, a try that does not about 0.1. So the marks are modest:
  # about three in ten standing.)
  help:
    curriculum:
      - name: AllHelp
        completion_criteria: { measure: reward, behavior: SmallRiseFull, signal_smoothing: true, min_lesson_length: 500, threshold: 0.5 }
        value: 1.0
      - name: Help66
        completion_criteria: { measure: reward, behavior: SmallRiseFull, signal_smoothing: true, min_lesson_length: 500, threshold: 0.5 }
        value: 0.66
      - name: Help33
        completion_criteria: { measure: reward, behavior: SmallRiseFull, signal_smoothing: true, min_lesson_length: 500, threshold: 0.5 }
        value: 0.33
      - name: NoHelp
        value: 0.0
