# pace8 (October 29; Luis: "Penalise holds"): as pace7, on Builds/RiseTrain24, where the pacer may keep a pose only as
# long as its way says or shorter (RiseAgent.PacesLongest 1): free to keep poses longer, every pacer kept prop and push
# longer, standing no more often, holding more; kept to shortening, pace7's pacer at 40,000 held 0.18 s a standing try
# (as searched 0.29) and stood as often. Begun from pace7's saves (the joints at 199,900, the pacer at 39,997). Resume
# with train_smallrise_pace8_resume.yaml.
#   --env-args -riseTrain -trainFull 1 -trainPace 1 -trainHoldsAsHeld 1 -trainFalls 1 -trainFreshFalls 1 -trainRetries 0.7 -trainRetriesAtMost 8 -trainNearer 1 -trainWays <ways file>
behaviors:
  SmallRiseFull:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace7/SmallRiseFull/SmallRiseFull-199900.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 200
  SmallRisePace:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace7/SmallRisePace/SmallRisePace-39997.pt
    hyperparameters:
      batch_size: 512
      buffer_size: 2048
      learning_rate: 1.0e-3
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 20000
    keep_checkpoints: 200
