# pace5 (October 28; Luis: "Penalise holds"): as pace4, and the pacer is charged 0.1 a second the body getting up is
# slow (no part faster than 12 cm/s) past 0.25 s at a stretch, only in a try that stood (-trainHoldCost, -trainHoldGrace).
# Charged seconds alone (0.02), pace4's pacer learnt to keep poses longer (prop 2.2 s for 1.6), as that stood a little
# more often. The joints begun from pace4 at 199,961; the pacer new, saved every 20,000. Resume with
# train_smallrise_pace5_resume.yaml.
#   --env-args -riseTrain -trainFull 1 -trainPace 1 -trainFalls 1 -trainFreshFalls 1 -trainRetries 0.7 -trainRetriesAtMost 8 -trainNearer 1 -trainWays <ways file>
behaviors:
  SmallRiseFull:
    trainer_type: ppo
    init_path: D:/Dev/mlagents-results/pace4/SmallRiseFull/SmallRiseFull-199961.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 200
  SmallRisePace:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 20000
    keep_checkpoints: 200
